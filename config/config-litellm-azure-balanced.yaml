# Graphiti MCP Server Configuration - BALANCED (Recommended)
#
# This is the RECOMMENDED configuration balancing performance and detail.
# Expected processing time: 4-6 minutes per episode (vs 10-15 minutes with full config)
#
# PERFORMANCE OPTIMIZATIONS:
# - 7 core entity types (vs 14 in standard config)
# - Simplified descriptions (20-50 words vs 100-400 words)
# - 40-60% faster entity extraction
# - Includes outcome tracking and metrics
#
# USE THIS CONFIG FOR:
# - Balanced speed and detail
# - Tracking solution effectiveness (Outcome + Metric)
# - Production workflows
# - When you need performance metrics
#
# Model format for Azure: "azure/<deployment_name>"

server:
  transport: "stdio"  # stdio for Claude Code integration

llm:
  provider: "litellm"
  model: "azure/model-router"  # Azure deployment name prefixed with "azure/"
  max_tokens: 4096

  providers:
    litellm:
      api_key: ${AZURE_OPENAI_API_KEY}
      base_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-12-01-preview}

embedder:
  provider: "azure_openai"
  model: "text-embedding-3-small"
  dimensions: 1536

  providers:
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-12-01-preview}
      deployment_name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
      use_azure_ad: false

database:
  provider: "falkordb"

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://localhost:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:graphiti_memory}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:developer_gyasisutton}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:gyasisutton}

  # BALANCED CONFIG: 7 Entity Types
  # Optimized descriptions for speed (20-50 words vs 100-400 words)
  # Includes outcome tracking and metrics for effectiveness measurement
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions. Trigger: 'I want/like/prefer', 'I don't want/dislike'. Examples: 'I prefer TypeScript', 'I always use functional components'. PRIORITY: Extract even subtle preferences."

    - name: "Problem"
      description: "Errors, bugs, issues, obstacles. Trigger: Error messages, 'Bug', 'Issue', 'Problem', 'Failure'. Examples: 'TypeScript compilation error', 'Memory leak', 'API timeout'. Solved by Solutions/Workflows."

    - name: "Solution"
      description: "Fixes, workarounds, resolutions. Trigger: 'Fix', 'Solution', 'Resolved using', 'Add/Update/Modify'. Examples: 'Add type annotation', 'Add cleanup hook', 'Use retry logic'. Solves Problems, Results in Outcomes."

    - name: "Workflow"
      description: "Multi-step processes, complete workflows. Trigger: 'Complete workflow', 'Multi-phase', 'End-to-end', conditional logic. Examples: 'Debugging workflow: check logs → analyze → fix → verify', 'Deployment process'. Contains ToolPatterns."

    - name: "ToolPattern"
      description: "Successful tool sequences, command chains. Trigger: Tool names in sequence, 'Tool pattern', 'Using X → Y → Z'. Examples: 'search → read → edit', 'docker build → tag → push'. Part of Workflows."

    - name: "Outcome"
      description: "Results, consequences, effects of actions. Trigger: 'Success', 'Failed', 'Result', 'Performance improved', 'Resolved'. Examples: 'Success - compilation passes', 'Performance improved by 50%'. Result of Solutions/Workflows, Measured by Metrics."

    - name: "Metric"
      description: "Quantifiable measurements with numbers/percentages. Trigger: Numbers with units, percentages, counts, rates. Examples: '95% success rate', '5 minutes saved', '60% memory reduction'. Measures Workflows/Solutions, Quantifies Outcomes."
