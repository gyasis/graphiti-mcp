version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-graphiti
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    command:
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "1000"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphiti-net

networks:
  graphiti-net:
    driver: bridge

volumes:
  falkordb_data:
    driver: local
