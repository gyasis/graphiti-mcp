version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb@sha256:2496643cabd67e87fd82458383400c049324daec1fe674ba0db4c5bdaca5d25f  # FalkorDB 4.18.11, pinned by digest
    container_name: falkordb-graphiti       # the name graphiti-mcp connects to; renaming starts a SECOND, EMPTY graph
    restart: unless-stopped
    mem_limit: 6g
    ports:
      # FALKORDB_URI in .env points here. A mismatch silently starts a second,
      # empty graph beside the real one. R-PORT1 registers 7603 for FalkorDB on
      # this host; moving there means changing .env in the same commit.
      - "6380:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    environment:
      # Leave NODE_CREATION_BUFFER at its default. A small buffer keeps the
      # matrices resizing, which leaves the graph un-flushed at fork time, and
      # every forking persistence path then dies in _AfterForkChild: RDB BGSAVE
      # writes nothing while reporting ok, and the AOF base rewrite cannot even
      # initialise. See ~/.claude/rulebook/domains/graphiti.md R-GR6.
      FALKORDB_ARGS: "CACHE_SIZE 25"
      # AOF is the durable path: every write is appended, and the write path does
      # not fork. Redis loads from the AOF when this is `yes`, so the AOF must
      # already exist on the volume. If appendonlydir/ is ever empty or lost,
      # set this back to `no`, start, then `CONFIG SET appendonly yes` to build
      # it and confirm aof_base_size > 0 before flipping back. Starting with
      # `yes` against an absent AOF brings the graph up EMPTY.
      REDIS_ARGS: "--dir /var/lib/falkordb/data --dbfilename dump.rdb --appendonly yes --appendfsync everysec --save 60 100 --save 300 10 --maxmemory 4gb --maxmemory-policy noeviction"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphiti-net

networks:
  graphiti-net:
    driver: bridge

volumes:
  falkordb_data:
    driver: local
